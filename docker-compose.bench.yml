# ARTEX Tencent TSec Benchmark 평가용 이미지 - 로컬에서 한 번에 build + run.
# 운영용 docker-compose.yml(멀티 서비스: artex+postgres)과는 서로 영향을 주지 않는다.
# 사용법:
#   cp bench/.env.example bench/.env   # 填 LLM_API_KEY / BENCHMARK_TOKEN 等
#   docker compose -f docker-compose.bench.yml up --build      # 빌드 후 포그라운드 실행(로그 확인)
#   docker compose -f docker-compose.bench.yml up --build -d   # 백그라운드
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 정지(-v를 붙이면 데이터 볼륨까지 삭제)
# 브라우저: http://localhost:8787 (ADMIN_PASSWORD로 로그인)

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # 물리 머신과 네트워크를 공유: 컨테이너가 호스트 네트워크 스택을 그대로 사용해, 호스트/VPN 상의 타깃 네트워크에 직접 접속할 수 있다.
    # host 모드에서는 ports 매핑을 쓰지 않고 컨테이너가 호스트 포트를 직접 사용한다: 8787(UI/API), 8788(프록시),
    # 그리고 내부 PostgreSQL 5432 —— 이 세 포트가 호스트에서 비어 있는지 반드시 확인할 것(로컬 테스트 전에 해당 포트를 쓰는 서비스를 먼저 중지).
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
